<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Faktura → XLS OFFLINE (Auto accounts)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h2>Фактура маълумотлари</h2>

  <div class="form-grid">

    <div class="form-group">
      <label for="date">Фактура санаси:</label>
      <input type="date" id="date">
    </div>

    <div class="form-group">
      <label for="invoiceNo">Фактура рақами:</label>
      <input type="text" id="invoiceNo" placeholder="№">
    </div>

    <div class="form-group">
      <label for="startNo">Жадвал бошланғич рақами (N):</label>
      <input type="number" id="startNo" value="101">
    </div>

    <div class="form-group">
      <label for="type">Фактура тури:</label>
      <select id="type">
        <option value="Гаров реестр">Гаров реестр</option>
        <option value="КАТМ">КАТМ</option>
        <option value="АдлияОАКТМ">Адлия</option>
        <option value="TRANS-INSSURANT">Sugurta</option>
      </select>
    </div>

    <div class="form-group">
      <label for="total">Умумий суммаси:</label>
      <input type="number" id="total" placeholder="Суммани киритинг">
    </div>

    <div class="form-group button-group">
      <button id="exportBtn">📥 Шаблон экспорт</button>
    </div>

  </div>

  <table id="tbl">
    <thead>
      <tr>
        <th>N</th>
        <th>Filial</th>
        <th>Фойдаланиш сони</th>
        <th>Amount</th>
      </tr>
    </thead>

    <tbody></tbody>

    <tfoot>
      <tr>
        <td colspan="2">ИТОГ</td>
        <td id="sumCnt">0</td>
        <td id="sumAmt">0.00</td>
      </tr>
    </tfoot>
  </table>
</div>

 <!-- <button id="exportBtn">📥 Шаблон экспорт</button> -->
</div>

<script src="app.js"></script>
</body>
</html>
